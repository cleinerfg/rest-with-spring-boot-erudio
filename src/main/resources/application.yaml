spring:
  application:
    name: rest-with-spring-boot-erudio
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/rest_with_spring?useTimezone=true&serverTimezone=UTC
    username: user
    password: pass
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
    #        dialect: org.hibernate.dialect.MySQLDialect # dialect was deprecated
    show-sql: false
    open-in-view: false
